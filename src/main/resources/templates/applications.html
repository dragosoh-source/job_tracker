<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Tracker</title>
</head>
<body>
<h1>My Job Applications</h1>
<a th:href="@{/applications/new}"><button type="button">Add Application</button></a>
<form th:action="@{/applications}" method="get">
    <label for="status">Filter by status:</label>
    <select name="status" id="status">
        <option value="">All</option>
        <option th:each="s : ${statuses}"
                th:value="${s}"
                th:text="${s}"
                th:selected="${s == selectedStatus}"></option>
    </select>
    <button type="submit">Filter</button>
</form>
<table border="1">
    <tr>
        <th>Company</th>
        <th>Position</th>
        <th>Application Date</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    <tr th:each="a : ${applications}">
        <td th:text="${a.companyName}"></td>
        <td th:text="${a.position}"></td>
        <td th:text="${a.applicationDate}"></td>
        <td th:text="${a.status}"></td>
        <td>
            <a th:href="@{/applications/{id}/edit(id=${a.id})}">
                <button type="button">Edit</button>
            </a>
            <form th:action="@{/applications/{id}/delete(id=${a.id})}" method="post">
                    <button type="submit">Delete</button>
            </form>

        </td>
    </tr>



</table>
</body>
</html>
