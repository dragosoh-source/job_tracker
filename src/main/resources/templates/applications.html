<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Job Tracker</title>
</head>
<body>
<h1>My Job Applications</h1>
<a th:href="@{/applications/new}"><button type="button">Add Application</button></a>
<table border="1">
    <tr>
        <th>Company</th>
        <th>Position</th>
        <th>Application Date</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    <tr th:each="a : ${applications}">
        <td th:text="${a.companyName}"></td>
        <td th:text="${a.position}"></td>
        <td th:text="${a.applicationDate}"></td>
        <td th:text="${a.status}"></td>
        <td>
            <a th:href="@{/applications/{id}/edit(id=${a.id})}">
                <button type="submit">Edit</button>
            </a>
        </td>
        <td>
            <form th:action="@{/applications/{id}/delete(id=${a.id})}" method="post">
                    <button type="submit">Delete</button>
            </form>

        </td>
    </tr>



</table>
</body>
</html>
