<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 mb-0">My Job Applications</h1>
        <a class="btn btn-primary" th:href="@{/applications/new}">Add Application</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form class="row g-2 align-items-end" th:action="@{/applications}" method="get">
                <div class="col-sm-6 col-md-4">
                    <label class="form-label" for="status">Filter by status:</label>
                    <select class="form-select" name="status" id="status">
                        <option value="">All</option>
                        <option th:each="s : ${statuses}"
                                th:value="${s}"
                                th:text="${s}"
                                th:selected="${s == selectedStatus}"></option>
                    </select>
                </div>
                <div class="col-auto">
                    <button class="btn btn-outline-secondary" type="submit">Filter</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Company</th>
                    <th>Position</th>
                    <th>Application Date</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${applications}">
                    <td th:text="${a.companyName}"></td>
                    <td th:text="${a.position}"></td>
                    <td th:text="${a.applicationDate}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${#strings.toString(a.status) == 'OFFER'} ? 'text-bg-success' :
                                              (${#strings.toString(a.status) == 'REJECTED'} ? 'text-bg-danger' :
                                              (${#strings.toString(a.status) == 'INTERVIEW'} ? 'text-bg-primary' : 'text-bg-secondary'))"
                              th:text="${a.status}"></span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/applications/{id}/edit(id=${a.id})}">Edit</a>
                        <form class="d-inline"
                              th:action="@{/applications/{id}/delete(id=${a.id})}" method="post"
                              onsubmit="return confirm('Are you sure you want to delete this application?');">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
