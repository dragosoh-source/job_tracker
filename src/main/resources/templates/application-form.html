<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container py-5" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h1 class="h3 mb-4" th:text="${jobApplication.id == null} ? 'New Application' : 'Edit Application'">My Application</h1>

            <form th:action="${jobApplication.id == null} ? @{/applications} : @{/applications/{id}/update(id=${jobApplication.id})}"
                  th:object="${jobApplication}" method="post">

                <div class="mb-3">
                    <label class="form-label" for="companyName">Company</label>
                    <input class="form-control" type="text" id="companyName" th:field="*{companyName}">
                    <small class="text-danger d-block mt-1" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="position">Position</label>
                    <input class="form-control" type="text" id="position" th:field="*{position}">
                    <small class="text-danger d-block mt-1" th:if="${#fields.hasErrors('position')}" th:errors="*{position}"></small>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="applicationDate">Application Date</label>
                    <input class="form-control" type="date" id="applicationDate" th:field="*{applicationDate}">
                    <small class="text-danger d-block mt-1" th:if="${#fields.hasErrors('applicationDate')}" th:errors="*{applicationDate}"></small>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="status">Status</label>
                    <select class="form-select" id="status" th:field="*{status}">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Save</button>
                    <a class="btn btn-outline-secondary" th:href="@{/applications}">Back to the list</a>
                </div>
            </form>

        </div>
    </div>
</div>
</body>
</html>
