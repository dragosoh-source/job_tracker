<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Job Tracker</title>
</head>

<body>
<h1 th:text="${jobApplication.id == null} ? 'New Application' : 'Edit Application'">My Application</h1>

<form th:action="${jobApplication.id == null} ? @{/applications} : @{/applications/{id}/update(id=${jobApplication.id})}"
      th:object="${jobApplication}" method="post">
    <p>
        <label for="companyName">Company</label>
        <input type="text" id="companyName" th:field="*{companyName}">
        <small style="color:red" th:if="${#fields.hasErrors('companyName')}" th:errors="*{companyName}"></small>
    </p>

    <p>
        <label for="position">Position</label>
        <input type="text" id="position" th:field="*{position}">
        <small style="color:red" th:if="${#fields.hasErrors('position')}" th:errors="*{position}"></small>
    </p>

    <p>
        <label for="applicationDate">Application Date</label>
        <input type="date" id="applicationDate" th:field="*{applicationDate}">
        <small style="color:red" th:if="${#fields.hasErrors('applicationDate')}" th:errors="*{applicationDate}"></small>
    </p>

    <p>
        <label for="status">Status</label>
        <select id="status" th:field="*{status}">
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
        </select>
    </p>

    <button type="submit">Save</button>
</form>

<p><a th:href="@{/applications}">Back to the list</a></p>
</body>
</html>
